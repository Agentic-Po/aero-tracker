name: snapshot-epoch

on:
  schedule:
    - cron: '0 23 * * 3'    # Wednesday 23:00 UTC — 1h before epoch flip
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip DB write and Telegram post'
        type: boolean
        default: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-v1

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Run epoch snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG_DUMP_HTML: '1'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m scraper.main --mode epoch --dry-run
          else
            python -m scraper.main --mode epoch
          fi

      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html-epoch-${{ github.run_id }}
          path: debug_dumps/
          if-no-files-found: ignore
