name: diagnose-lightpanda

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Lightpanda
        run: |
          curl -L -o lightpanda \
            https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux
          chmod +x lightpanda
          sudo mv lightpanda /usr/local/bin/lightpanda

      - name: Write inject script
        run: |
          mkdir -p out
          cat > inject.js <<'INJECT_EOF'
          // Seed wagmi-drome state + lock Storage proto to keep it pinned.
          // Runs BEFORE any other script on the page (via Lightpanda --inject-script-file).
          (() => {
            const fakeAddr = '0x000000000000000000000000000000000000dEaD';

            // Stub ethereum (used by 'injected' connector path if it gets revived)
            window.ethereum = {
              isMetaMask: true,
              isConnected: () => true,
              chainId: '0x2105',
              networkVersion: '8453',
              selectedAddress: fakeAddr,
              request: async ({ method }) => {
                switch (method) {
                  case 'eth_chainId': return '0x2105';
                  case 'eth_accounts':
                  case 'eth_requestAccounts': return [fakeAddr];
                  case 'net_version': return '8453';
                  case 'wallet_getPermissions':
                  case 'wallet_requestPermissions':
                    return [{ parentCapability: 'eth_accounts', caveats: [] }];
                  case 'wallet_switchEthereumChain':
                  case 'wallet_addEthereumChain': return null;
                  default: return null;
                }
              },
              on: () => {}, removeListener: () => {}, removeAllListeners: () => {},
              enable: async () => [fakeAddr],
            };
            window.ethereum.providers = [window.ethereum];

            const wagmiState = {
              state: {
                connections: { __type: 'Map', value: [
                  ['injected-stub', {
                    accounts: [fakeAddr],
                    chainId: 8453,
                    connector: { id: 'injected', name: 'Injected', type: 'injected', uid: 'injected-stub' },
                  }],
                ]},
                chainId: 8453,
                current: 'injected-stub',
              },
              version: 2,
            };
            const wagmiStoreJson = JSON.stringify(wagmiState);

            const realSet = Storage.prototype.setItem;
            const realGet = Storage.prototype.getItem;
            const realRemove = Storage.prototype.removeItem;

            Storage.prototype.setItem = function (k, v) {
              if (k && k.startsWith && k.startsWith('wagmi-drome')) {
                return realSet.call(this, k, wagmiStoreJson);
              }
              if (k === '@appkit/connection_status') {
                return realSet.call(this, k, 'connected');
              }
              return realSet.call(this, k, v);
            };
            Storage.prototype.getItem = function (k) {
              if (k && k.startsWith && k.startsWith('wagmi-drome')) return wagmiStoreJson;
              if (k === '@appkit/connection_status') return 'connected';
              if (k === '@appkit/active_namespace') return 'eip155';
              if (k === '@appkit/active_caip_network_id') return 'eip155:8453';
              return realGet.call(this, k);
            };
            Storage.prototype.removeItem = function (k) {
              if (k && k.startsWith && (k.startsWith('wagmi-drome') || k.startsWith('@appkit/'))) return;
              return realRemove.call(this, k);
            };

            try {
              realSet.call(localStorage, 'wagmi-drome-v5.0.0.store', wagmiStoreJson);
              realSet.call(localStorage, '@appkit/connection_status', 'connected');
              realSet.call(localStorage, '@appkit/active_namespace', 'eip155');
              realSet.call(localStorage, '@appkit/active_caip_network_id', 'eip155:8453');
              realSet.call(localStorage, 'disabledChains', '[]');
            } catch (e) {}
          })();
          INJECT_EOF
          wc -c inject.js
          head -3 inject.js

      - name: Fetch /vote with inject-script + wait-selector
        run: |
          set +e
          lightpanda fetch \
            --dump html \
            --inject-script-file inject.js \
            --wait-selector '[data-test-amount]' \
            --wait-ms 60000 \
            --terminate-ms 90000 \
            --http-timeout 30000 \
            --log-level info \
            https://aerodrome.finance/vote \
            > out/70-vote-injected.html 2> out/70-vote-injected.stderr
          echo "exit=$? bytes=$(wc -c < out/70-vote-injected.html)" > out/70-vote-injected.meta
          echo '-- grep data-test-amount --' >> out/70-vote-injected.meta
          grep -c 'data-test-amount' out/70-vote-injected.html >> out/70-vote-injected.meta 2>&1 || true
          echo '-- grep connect/wallet UI --' >> out/70-vote-injected.meta
          grep -c -i 'Browser Wallet\|WalletConnect\|You.ll need an' out/70-vote-injected.html >> out/70-vote-injected.meta 2>&1 || true

      - name: Fetch / homepage with inject-script (control)
        run: |
          set +e
          lightpanda fetch \
            --dump html \
            --inject-script-file inject.js \
            --wait-ms 20000 \
            --terminate-ms 40000 \
            --http-timeout 20000 \
            --log-level info \
            https://aerodrome.finance/ \
            > out/71-home-injected.html 2> out/71-home-injected.stderr
          echo "exit=$? bytes=$(wc -c < out/71-home-injected.html)" > out/71-home-injected.meta

      - name: Fetch /vote with --wait-script for data
        run: |
          set +e
          lightpanda fetch \
            --dump html \
            --inject-script-file inject.js \
            --wait-script 'document.querySelectorAll("[data-test-amount]").length > 0' \
            --wait-ms 60000 \
            --terminate-ms 90000 \
            --http-timeout 30000 \
            --log-level info \
            https://aerodrome.finance/vote \
            > out/72-vote-waitscript.html 2> out/72-vote-waitscript.stderr
          echo "exit=$? bytes=$(wc -c < out/72-vote-waitscript.html)" > out/72-vote-waitscript.meta
          echo '-- grep data-test-amount --' >> out/72-vote-waitscript.meta
          grep -c 'data-test-amount' out/72-vote-waitscript.html >> out/72-vote-waitscript.meta 2>&1 || true

      - name: Fetch /vote with debug log to see what fails
        run: |
          set +e
          lightpanda fetch \
            --dump html \
            --inject-script-file inject.js \
            --wait-ms 30000 \
            --terminate-ms 45000 \
            --http-timeout 20000 \
            --log-level debug \
            https://aerodrome.finance/vote \
            > out/73-vote-debug.html 2> out/73-vote-debug.stderr
          echo "exit=$? bytes=$(wc -c < out/73-vote-debug.html)" > out/73-vote-debug.meta
          echo '-- last 80 stderr lines --' >> out/73-vote-debug.meta
          tail -80 out/73-vote-debug.stderr >> out/73-vote-debug.meta 2>&1 || true

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightpanda-diagnose-${{ github.run_id }}
          path: |
            out/
            inject.js
